name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shortlink
          POSTGRES_PASSWORD: shortlink_dev
          POSTGRES_DB: shortlink
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENV: test
      API_KEY: test-key
      BASE_URL: http://127.0.0.1:8000
      CACHE_TTL: 3600
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg2://shortlink:shortlink_dev@localhost:5432/shortlink
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run black --check .

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=60