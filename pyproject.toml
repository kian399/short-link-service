[project]
name = "short-link-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kian Alexander Hill", email = "3543497461@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.3",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.16.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.5",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
short-link-service = "short_link_service:main"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "fakeredis>=2.40.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
