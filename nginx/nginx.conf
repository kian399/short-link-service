upstream shortlink_app {
    # 和 app 服务保持长连接，避免每个请求都重新握手
    server app:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 只压 JSON 响应，跳转是 302 无 body，压了也没收益
    gzip on;
    gzip_types application/json text/plain application/javascript;
    gzip_min_length 1024;
    gzip_comp_level 4;

    client_max_body_size 1m;
    server_tokens off;

    # 健康检查不写访问日志，避免被探活刷满磁盘
    location = /healthz {
        proxy_pass http://shortlink_app;
        access_log off;
        proxy_set_header Host $host;
    }

    # /metrics 只给本机和内网看。
    # 一开始是全开放的，演示时图省事；但线上把连接池、命中率、QPS 全裸奔在公网不合适，
    # 而且谁都能拿它刷 CPU。要看就 ssh 上去 curl 127.0.0.1，或者 docker exec 进 app。
    # 私网段全放行是因为 Docker Desktop 端口映射过来的源地址不一定是 172.x
    # （有时是 192.168.65.x），只写一个网段会把自己也挡在外面。
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://shortlink_app;
    }

    # 跳转是核心路径：关掉 nginx 侧的任何缓冲与重试，保持 302 原样返回
    location / {
        proxy_pass http://shortlink_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 302 不缓冲，写完直接推给客户端，少一次拷贝。
        # 注意这里管的是缓冲，不是缓存：302 不被缓存靠的是没设 Cache-Control
        # 也没有配 proxy_cache，两件事别混。
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
